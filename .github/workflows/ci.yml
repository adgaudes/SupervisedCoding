name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # engines.node is >= 22.16 for running the extension inside Pi, but the suite runs TypeScript files directly,
        # which Node executes without a flag only from 22.18. Test the lowest version that can run it, and a current one.
        node-version: ['22.18.0', '24.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # The integration harness and the typecheck resolve Pi's own packages from a Pi installation (PI_INSTALL_ROOT),
      # exactly as Pi does when it loads the extension. A runner has none, so build the same layout from the published
      # packages, outside the workspace so it stays out of the packaging check.
      # The versions are pinned to the Pi release this extension is developed against: installing the tags instead made
      # the resolved tree differ between runners and broke the typecheck on two copies of Pi's own types. Bump them when
      # moving to a newer Pi, so an API change shows up as a deliberate commit rather than as a random red build.
      - name: Provide Pi's packages to the test harness
        shell: bash
        env:
          PI_VERSION: 0.87.1
          TYPEBOX_VERSION: 1.3.27
        run: |
          mkdir -p "$RUNNER_TEMP/pi-install/releases/ci"
          cd "$RUNNER_TEMP/pi-install/releases/ci"
          npm init -y > /dev/null
          npm install --no-audit --no-fund \
            "@earendil-works/pi-coding-agent@$PI_VERSION" \
            "@earendil-works/pi-ai@$PI_VERSION" \
            "typebox@$TYPEBOX_VERSION"
          npm dedupe --no-audit --no-fund
          echo ci > "$RUNNER_TEMP/pi-install/current-version"
          # Printed so a failure caused by Pi's own dependency tree is diagnosable from the log alone.
          npm ls --all --depth 1 || true

      - run: npm ci
      - run: npm test
        env:
          PI_INSTALL_ROOT: ${{ runner.temp }}/pi-install
      - run: npm audit --omit=dev
      - run: npm pack --dry-run --json
